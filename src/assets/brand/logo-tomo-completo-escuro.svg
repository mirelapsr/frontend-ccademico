<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" width="100%" height="100%" role="img" aria-label="Tomo Acadêmico">
  <!-- Variante para fundos escuros (sidebar em Ink #191713): fundo transparente,
       símbolo na paleta-fonte e assinatura tipográfica em Paper (#F7F2E7). -->

  <!-- Símbolo -->
  <g id="simbolo-tomo">
    <!-- Eixo / marcador central em "T" (Press) -->
    <path fill="#A8252B" d="M 42 22 H 178 L 126 51 V 198 L 110 183 L 94 198 V 51 Z" />

    <!-- Página esquerda (Marine) -->
    <path fill="#22406E" d="M 22 39
         C 22 35, 25 33, 29 35
         L 66 54
         C 74 58, 82 56, 86 52
         V 168
         C 86 177, 77 181, 69 177
         L 26 156
         C 23 154, 22 151, 22 147
         Z" />

    <!-- Página direita (Ochre) -->
    <path fill="#8F6412" d="M 198 39
         C 198 35, 195 33, 191 35
         L 154 54
         C 146 58, 138 56, 134 52
         V 168
         C 134 177, 143 181, 151 177
         L 194 156
         C 197 154, 198 151, 198 147
         Z" />
  </g>

  <!-- Assinatura tipográfica (Paper) -->
  <g id="assinatura-tomo" fill="#F7F2E7">
    <text x="224" y="124" font-family="Georgia, &#39;Playfair Display&#39;, &#39;Times New Roman&#39;, serif" font-size="108" font-weight="700" letter-spacing="-2.5">
      Tomo
    </text>
    <text x="230" y="168" font-family="system-ui, -apple-system, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" font-size="31" font-weight="600" letter-spacing="8.5">
      ACADÊMICO
    </text>
  </g>
</svg>
